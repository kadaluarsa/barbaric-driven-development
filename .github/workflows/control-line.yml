name: control-line
on:
  pull_request:
  push:
    branches: [main]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack eval (I15+I16+I17)
        run: bash tests/control-line.sh
      - name: I17 Dune bar T1–T7
        run: bash tests/i17_dune.sh
      - name: /barbar farm
        run: bash tests/barbar.sh
