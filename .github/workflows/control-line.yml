name: control-line
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shipped files match the manifest (t96)
        run: bash tests/drift.sh
      - name: Pack eval (I15+I16+I17+I18)
        run: bash tests/control-line.sh
      - name: Lint (bash 3.2 syntax, shellcheck, python compile)
        run: bash tests/lint.sh
      - name: Spec critic (t57; n/a unless a GENERATE 05b hop is open)
        run: bash tests/critique.sh
      - name: Divergence (t58; n/a unless a [diverge] brief is on GENERATE 05b)
        run: bash tests/diverge.sh
      - name: I17 Dune bar T1–T7
        run: bash tests/i17_dune.sh
      - name: I18 Enforcement T8–T96
        run: bash tests/enforcement.sh
      - name: /barbar farm
        run: bash tests/barbar.sh
  # t78: accepted slices' tests (docs/cascade/regress.md) on every PR, with the merge gate's rules. Lines ending in
  # `# gate-only` (e.g. xcodebuild, which this Linux runner cannot run) are skipped here and run at the merge gate.
  # A separate job, so a slow suite never starves the eval job's 10 minutes.
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # t101's REGRESS line needs real Gradle (8.5 to <9.2) and a JDK; same pinned download as pack-self-check.
      - name: real Gradle 9.1.0 for t101
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gradle-9.1.0.zip" "https://services.gradle.org/distributions/gradle-9.1.0-bin.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle-9.1.0.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-9.1.0.zip" -d "$RUNNER_TEMP"
          echo "BDD_T101_GRADLE=$RUNNER_TEMP/gradle-9.1.0/bin/gradle" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Regression suite (t78)
        run: bash tests/regress.sh --gate --ci
