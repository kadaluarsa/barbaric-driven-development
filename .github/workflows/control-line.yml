name: control-line
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack eval (I15+I16+I17+I18)
        run: bash tests/control-line.sh
      - name: Lint (bash 3.2 syntax, shellcheck, python compile)
        run: bash tests/lint.sh
      - name: Spec critic (t57; n/a unless a GENERATE 05b hop is open)
        run: bash tests/critique.sh
      - name: Divergence (t58; n/a unless a [diverge] brief is on GENERATE 05b)
        run: bash tests/diverge.sh
      - name: I17 Dune bar T1–T7
        run: bash tests/i17_dune.sh
      - name: I18 Enforcement T8–T22
        run: bash tests/enforcement.sh
      - name: /barbar farm
        run: bash tests/barbar.sh
  # t78: accepted slices' tests (docs/cascade/regress.md) on every PR, with the merge gate's rules. Lines ending in
  # `# gate-only` (e.g. xcodebuild, which this Linux runner cannot run) are skipped here and run at the merge gate.
  # A separate job, so a slow suite never starves the eval job's 10 minutes.
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regression suite (t78)
        run: bash tests/regress.sh --gate --ci
